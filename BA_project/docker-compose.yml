version: '3.8'
services:
  flask:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - MONGODB_URI=mongodb://mongo:27017/ba_project
      - BENTOML_ENDPOINT=http://host.docker.internal:3000
      - SECRET_KEY=dev-secret-key-12345
    volumes:
      - .:/app
    depends_on:
      - mongo
    command: flask run --host=0.0.0.0
  
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
